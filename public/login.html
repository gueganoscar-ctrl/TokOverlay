<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokOverlay - Authentification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body.app-bg {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .auth-card {
      width: 100%; max-width: 420px; padding: 32px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .tabs { display: flex; background: var(--ink); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 700; color: var(--text-lo); cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab.active { background: var(--surface-2); color: #FFFFFF; }
    .auth-form { display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body class="app-bg">

  <div style="margin-bottom: 20px;">
    <a href="/" class="btn btn-secondary">← Retour au site</a>
  </div>

  <div class="auth-card card">
    <div style="text-align: center;">
      <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:6px;">
        <span class="live-dot"></span>
        <h1 class="chroma-title" data-text="TokOverlay" style="font-size: 26px;">TokOverlay</h1>
      </div>
      <p style="color: var(--text-lo); font-size: 13px;">Accédez à votre espace streamer</p>
    </div>

    <div id="error-alert" class="hidden" style="background: rgba(255,84,112,0.12); color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: 8px; font-size: 12px; text-align: center;"></div>

    <div class="tabs">
      <div id="tab-login" class="tab active" onclick="switchTab('login')">Connexion</div>
      <div id="tab-register" class="tab" onclick="switchTab('register')">Créer un compte</div>
    </div>

    <!-- Formulaire Connexion -->
    <form id="form-login" class="auth-form" action="/login" method="POST">
      <div>
        <label>Pseudo TikTok (sans @)</label>
        <input type="text" name="pseudo" placeholder="ex: mon_pseudo" required>
      </div>
      <div>
        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <div>
        <a href="#" onclick="motDePasseOublie(event)" style="font-size: 11px; color: var(--cyan); text-decoration: none;">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top: 6px;">Se connecter</button>
    </form>

    <!-- Formulaire Inscription -->
    <form id="form-register" class="auth-form hidden" action="/register" method="POST">
      <div>
        <label>Pseudo TikTok</label>
        <input type="text" name="pseudo" placeholder="Ex: mon_pseudo" required>
      </div>
      <div>
        <label>Clé API Live Connector</label>
        <input type="text" name="apiKey" placeholder="Votre Clé API" required>
      </div>
      <div>
        <label>Email</label>
        <input type="email" name="email" placeholder="votre@email.com" required>
      </div>
      <div>
        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top: 6px;">Créer mon compte</button>
    </form>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const tab = params.get('tab');
      const alertBox = document.getElementById('error-alert');
      
      if (tab === 'register') switchTab('register');

      if (error) {
        alertBox.classList.remove('hidden');
        if (error === 'email_exists') { alertBox.textContent = "Cet email est déjà utilisé."; switchTab('register'); }
        else if (error === 'pseudo_exists') { alertBox.textContent = "Ce pseudo est déjà utilisé."; switchTab('register'); }
        else if (error === 'wrong_credentials') { alertBox.textContent = "Pseudo ou mot de passe incorrect."; switchTab('login'); }
      }
    });

    function switchTab(t) {
      document.getElementById('tab-login').classList.toggle('active', t === 'login');
      document.getElementById('tab-register').classList.toggle('active', t === 'register');
      
      document.getElementById('form-login').classList.toggle('hidden', t !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', t !== 'register');
    }

    function motDePasseOublie(e) {
      e.preventDefault();
      const email = prompt("Entrez votre e-mail :");
      if (!email) return;
      fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      }).then(r => r.json()).then(data => alert(data.message || "Instructions envoyées."));
    }
  </script>
</body>
</html>
