<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Studio - VIP Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; 
            color: white;
            overflow: hidden; 
        }

        .liste-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 450px;
        }

        .carte-joueur {
            background: rgba(15, 15, 20, 0.75); 
            border-left: 4px solid #00f2fe;
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            animation: glissement 0.5s ease-out forwards;
            transition: all 0.4s ease;
        }

        .carte-joueur.dernier-joueur {
            background: rgba(15, 15, 20, 0.95);
            border-left: 8px solid #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6), 0 4px 15px rgba(0,0,0,0.8);
            transform: scale(1.02);
        }

        @keyframes glissement {
            from { opacity: 0; transform: translateX(-50px) scale(1); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .en-tete {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .groupe-tiktok {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pseudo-tiktok { 
            font-weight: bold; 
            font-size: 13px; 
            color: #00f2fe; 
        }

        .badge-nouveau {
            display: none;
            background: #ffeb3b;
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(255, 235, 59, 0.8);
        }

        .dernier-joueur .badge-nouveau {
            display: block;
            animation: pulseBadge 1s infinite alternate;
        }

        @keyframes pulseBadge {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.1); }
        }

        .infos-cadeau {
            font-size: 13px;
            color: #ffeb3b;
            font-weight: bold;
            background: rgba(255, 235, 59, 0.15);
            padding: 3px 6px;
            border-radius: 4px;
        }

        .message-roblox {
            font-size: 22px; 
            font-weight: 900; 
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="liste-container" id="liste-joueurs"></div>

    <script>
        const socket = io();
        const listeJoueurs = document.getElementById('liste-joueurs');
        const joueursEnAttente = {};

        // Récupération automatique du pseudo, du token et du mode démo depuis l'URL
        const pathParts = window.location.pathname.split('/');
        const pseudoStreamer = pathParts[pathParts.length - 1];
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const isDemo = params.get('demo') === '1';

        // Connexion sécurisée au serveur si on n'est pas en mode démo
        if (pseudoStreamer && !isDemo) {
            socket.emit('rejoindre', { pseudo: pseudoStreamer, token: token });
        }

        const VALEUR_CADEAUX = {
            "whale diving": 2150,
            "galaxy": 1000,
            "swan": 699,
            "donut": 30,
            "corgi": 299
        };

        function safeDomId(value) {
            return String(value || 'user').replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        socket.on('vip_alert', (data) => {
            joueursEnAttente[data.username] = data.giftName;
        });

        // Fonction principale pour afficher un joueur
        function afficherCarteVIP(data) {
            const domId = safeDomId(data.username);
            const carteExistante = document.getElementById(`carte-${domId}`);
            if (carteExistante) {
                const msgElement = document.getElementById(`msg-${domId}`);
                if (msgElement) msgElement.textContent = `🎮 ${data.message || ''}`;
                return;
            }

            const nomDuCadeau = joueursEnAttente[data.username] || "galaxy";

            const anciennesCartes = document.querySelectorAll('.dernier-joueur');
            anciennesCartes.forEach(c => c.classList.remove('dernier-joueur'));

            const pieces = VALEUR_CADEAUX[nomDuCadeau.toLowerCase()] || "???";

            const carte = document.createElement('div');
            carte.id = `carte-${domId}`;
            carte.className = 'carte-joueur dernier-joueur';

            const enTete = document.createElement('div');
            enTete.className = 'en-tete';

            const groupeTiktok = document.createElement('div');
            groupeTiktok.className = 'groupe-tiktok';

            const pseudoSpan = document.createElement('span');
            pseudoSpan.className = 'pseudo-tiktok';
            pseudoSpan.textContent = `@${data.username || ''}`;

            const badgeSpan = document.createElement('span');
            badgeSpan.className = 'badge-nouveau';
            badgeSpan.textContent = '✨ Nouveau';

            groupeTiktok.append(pseudoSpan, badgeSpan);

            const infosCadeau = document.createElement('span');
            infosCadeau.className = 'infos-cadeau';
            infosCadeau.textContent = `🎁 ${nomDuCadeau} (${pieces} 🪙)`;

            enTete.append(groupeTiktok, infosCadeau);

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-roblox';
            messageDiv.id = `msg-${domId}`;
            messageDiv.textContent = `🎮 ${data.message || ''}`;

            carte.append(enTete, messageDiv);
            listeJoueurs.prepend(carte);

            if (listeJoueurs.children.length > 6) {
                listeJoueurs.removeChild(listeJoueurs.lastChild);
            }
        }

        // Écoute des événements réels
        socket.on('roblox_pseudo', afficherCarteVIP);

        // MODE DÉMO
        if (isDemo) {
            setTimeout(() => {
                joueursEnAttente["DemoUser1"] = "galaxy";
                afficherCarteVIP({ username: "DemoUser1", message: "MonPseudoRoblox123" });
            }, 1000);
            
            setTimeout(() => {
                joueursEnAttente["DemoUser2"] = "donut";
                afficherCarteVIP({ username: "DemoUser2", message: "SniperPro99" });
            }, 4000);
        }
    </script>
</body>
</html>
