<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <meta charset="UTF-8">
  <title>TokOverlay - Multi-Styles &amp; Multi-Widgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --cyan: #22e5e0;
      --fuchsia: #fe2c55;
      --gold: #ffbe3d;
      --bg-dark: #100f14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #ffffff;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      padding: 10px;
      width: fit-content;
      height: fit-content;
    }

    #leaderboard { display: flex; flex-direction: column; gap: 10px; width: 260px; }
    #leaderboard h3 { margin: 0 0 4px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; }

    .carte-joueur { display: flex; align-items: center; position: relative; }
    .avatar-container { position: relative; margin-right: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); object-fit: cover; background: #1e1e24; }
    .crown { position: absolute; top: -12px; left: -6px; font-size: 16px; display: none; }
    .rank-1 .crown { display: block; }

    /* STYLE 1 : Cyber Cyan (Néon) */
    body.style-1 .carte-joueur {
      background: rgba(16, 15, 20, 0.85); border: 1px solid rgba(34, 229, 224, 0.3);
      border-radius: 10px; padding: 6px 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    body.style-1 .rank-1.carte-joueur { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 190, 61, 0.25); }

    /* STYLE 2 : Gold Prestige (Luxe) */
    body.style-2 .carte-joueur {
      background: linear-gradient(90deg, #18171d 0%, #0d0c10 100%);
      border-left: 4px solid var(--gold); border-radius: 0 12px 12px 0;
      padding: 8px 12px; box-shadow: 0 4px 15px rgba(255, 190, 61, 0.15);
    }
    body.style-2 .avatar { border-radius: 8px; border-color: var(--gold); }
    body.style-2 .valeur { color: var(--gold); }

    /* STYLE 3 : Synthwave Fuchsia */
    body.style-3 .carte-joueur {
      background: rgba(26, 25, 38, 0.9); border: 2px solid #fe2c55;
      border-radius: 14px; padding: 8px 12px; box-shadow: 0 0 15px rgba(254, 44, 85, 0.25);
    }
    body.style-3 .valeur { color: var(--fuchsia); }

    /* STYLE 4 : Minimalist Dark */
    body.style-4 .carte-joueur {
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px; padding: 6px 10px;
    }
    body.style-4 .valeur { color: #ffffff; }

    /* Best Gift Widget Styles */
    #best-gift-container {
      background: rgba(8, 8, 12, 0.9); border: 1px solid var(--gold); border-radius: 16px;
      padding: 16px; display: none; flex-direction: column; align-items: center; gap: 8px; width: 140px;
    }
    body.style-2 #best-gift-container { border-color: var(--gold); box-shadow: 0 0 20px rgba(255, 190, 61, 0.3); }
    body.style-3 #best-gift-container { border-color: var(--fuchsia); box-shadow: 0 0 20px rgba(254, 44, 85, 0.3); }

    .bg-title { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 800; color: var(--gold); text-transform: uppercase; }
    #bg-icon { width: 70px; height: 70px; object-fit: contain; }
    #bg-pseudo { font-size: 13px; font-weight: 700; color: #ffffff; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    /* Objectif Panel Styles */
    #objectif-panel {
      width: 320px; padding: 18px 20px; border-radius: 16px; background: var(--bg-dark); border: 1px solid #29283a;
    }
    #objectif-barre-fond { width: 100%; height: 22px; background: #18181f; border: 1px solid #29283a; border-radius: 999px; overflow: hidden; }
    #objectif-barre-remplissage { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--cyan), var(--fuchsia)); transition: width 0.4s ease; }
    #objectif-texte { margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #f4f4f5; display: flex; justify-content: space-between; }

    /* Coffre-Fort Panel Styles */
    #coffre-panel {
      width: 320px; background: var(--bg-dark); border: 2px solid var(--gold); border-radius: 20px;
      padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(255, 190, 61, 0.2); display: none; flex-direction: column; gap: 14px;
    }
    .coffre-header { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 800; color: var(--gold); text-transform: uppercase; }
    .coffre-recompense { font-size: 12px; color: #a1a1aa; font-weight: 600; background: #18181f; padding: 6px 12px; border-radius: 8px; border: 1px solid #29283a; }
    .coffre-cases-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
    .case-char {
      width: 32px; height: 38px; background: #18181f; border: 2px solid #29283a; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace;
      font-size: 18px; font-weight: 800; color: var(--gold); text-transform: uppercase;
    }
    .case-char.devoile { border-color: var(--gold); background: rgba(255, 190, 61, 0.1); color: #ffffff; }

    /* Enchères Panel Styles */
    #enchere-panel {
      width: 300px; padding: 20px; border-radius: 18px; background: var(--bg-dark);
      border: 1px solid rgba(34, 229, 224, 0.4); text-align: center; color: white; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: none;
    }
    body.style-2 #enchere-panel { border-color: var(--gold); }
    body.style-3 #enchere-panel { border-color: var(--fuchsia); }
    body.style-4 #enchere-panel { border-color: rgba(255,255,255,0.2); }

    .badges-top-container { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 12px; }
    .pill-badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: #18181f; border: 1px solid #29283a; padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700; color: #a1a1aa; text-transform: uppercase; width: 100%;
    }
    .pill-badge .highlight { font-family: 'JetBrains Mono', monospace; color: var(--cyan); font-weight: 800; }

    .ench-infos {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;
      background: #18181f; padding: 10px; border-radius: 10px; border: 1px solid #29283a;
    }
    .ench-info-ligne { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .ench-info-cle { color: #a1a1aa; font-weight: 700; text-transform: uppercase; }
    .ench-info-valeur { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-weight: 800; }

    #enchere-chrono { font-family: 'JetBrains Mono', monospace; font-size: 46px; font-weight: 800; color: #ffffff; line-height: 1; margin: 6px 0; }
    #enchere-chrono.phase-snipe { color: var(--fuchsia); }

    .carte-podium { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #18181f; border: 1px solid #29283a; width: 100%; margin-top: 6px; }
    .carte-podium .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .carte-podium .nickname { font-size: 12px; font-weight: 700; color: #f4f4f5; }
    .carte-podium .valeur { font-size: 11px; font-weight: 700; color: var(--cyan); margin-left: auto; font-family: 'JetBrains Mono', monospace; }

    .vouch-status {
      display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase;
      padding: 4px 10px; border-radius: 20px; margin: 8px 0;
      background: rgba(255, 190, 61, 0.12); border: 1px solid rgba(255, 190, 61, 0.35); color: var(--gold);
    }
    .vouch-status.confirme {
      background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.35); color: var(--success);
    }

    .winner-chat-box { background: #18181f; border: 1px solid #29283a; border-radius: 8px; padding: 8px; text-align: left; margin-top: 6px; }
    .winner-chat-title { font-size: 9px; font-weight: 800; color: var(--cyan); text-transform: uppercase; }
    .winner-chat-msg { font-size: 11px; color: #f4f4f5; font-style: italic; word-break: break-word; }
  </style>
</head>
<body>

  <div id="best-gift-container">
    <div class="bg-title">👑 Best Gift</div>
    <img id="bg-icon" src="" alt="Cadeau">
    <div id="bg-pseudo">En attente...</div>
  </div>

  <div id="leaderboard" style="display:none;">
    <h3 id="titre-classement"></h3>
    <p class="message-attente" id="message-attente-simple">Connexion au live...</p>
  </div>

  <div id="objectif-panel" style="display:none;">
    <div id="objectif-label" style="font-family:'Space Grotesk'; font-size:13px; font-weight:800; margin-bottom:10px;">Objectif du live</div>
    <div id="objectif-barre-fond"><div id="objectif-barre-remplissage"></div></div>
    <div id="objectif-texte">
      <span class="valeur-actuelle" id="objectif-valeur-actuelle">0</span>
      <span class="valeur-cible" id="objectif-valeur-cible">/ 0</span>
    </div>
  </div>

  <!-- Panel Coffre-Fort -->
  <div id="coffre-panel">
    <div class="coffre-header">
      <span class="coffre-icon" id="coffre-icon-etat">🔒</span>
      <span id="coffre-titre-texte">Coffre-Fort Verrouillé</span>
    </div>
    <div class="coffre-recompense" id="coffre-recompense-texte">Récompense : --</div>
    <div class="coffre-cases-grid" id="coffre-cases-grid"></div>
  </div>

  <!-- Panel Enchères -->
  <div id="enchere-panel">
    <div class="badges-top-container">
      <div class="pill-badge"><span>TokOverlay</span></div>
      <div class="pill-badge"><span>Vouchs :</span> <span class="highlight" id="global-vouch-count">0</span></div>
    </div>

    <div class="ench-infos">
      <div class="ench-info-ligne"><span class="ench-info-cle">Mise min</span><span class="ench-info-valeur" id="info-mise-min">--</span></div>
      <div class="ench-info-ligne"><span class="ench-info-cle">Snipe delay</span><span class="ench-info-valeur" id="info-snipe-delay" style="color:var(--fuchsia);">--</span></div>
    </div>

    <div id="groupe-chrono">
      <div id="enchere-label" style="font-size:10px; font-weight:800; text-transform:uppercase; color:#a1a1aa;">Temps restant</div>
      <div id="enchere-chrono">--</div>
    </div>

    <div id="enchere-classement" style="display:flex; flex-direction:column; gap:6px; margin-top:10px;"></div>

    <div id="enchere-gagnant-ecran" style="display:none; text-align:center;">
      <div class="titre-gagnant" style="font-size:10px; color:#a1a1aa; text-transform:uppercase;">🏆 Gagnant</div>
      <img id="gagnant-avatar" src="" alt="" style="width:54px; height:54px; border-radius:50%; border:2px solid var(--gold); margin:6px 0;">
      <div class="nom-gagnant" id="gagnant-nom" style="font-family:'Space Grotesk'; font-size:16px; font-weight:800;"></div>
      <div class="total-gagnant" id="gagnant-total" style="font-family:'JetBrains Mono'; font-size:12px; color:var(--gold); font-weight:700;"></div>

      <div class="vouch-status" id="vouch-status">⏳ En attente du vouch dans le chat</div>

      <div class="winner-chat-box">
        <div class="winner-chat-title">💬 Message du gagnant :</div>
        <div class="winner-chat-msg" id="gagnant-chat-message">En attente...</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const pathParts = window.location.pathname.split('/');
    const pseudo = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const token = params.get('token');
    const style = params.get('style') || '1';
    const isDemo = params.get('demo') === '1';

    document.body.className = `style-${style}`;

    function safeImageUrl(url, fallback) {
      if (typeof url === 'string' && (url.startsWith('https://') || url.startsWith('http://') || url.startsWith('/'))) {
        return url;
      }
      return fallback;
    }

    function creerCarteJoueur(user, rank, cle, emoji) {
      const carte = document.createElement('div');
      carte.className = `carte-joueur rank-${rank}`;

      const avatarContainer = document.createElement('div');
      avatarContainer.className = 'avatar-container';
      const crown = document.createElement('span');
      crown.className = 'crown'; crown.textContent = '👑';
      const img = document.createElement('img');
      img.className = 'avatar'; 
      img.src = safeImageUrl(user.profilePictureUrl, 'https://ui-avatars.com/api/?name=User');
      avatarContainer.append(crown, img);

      const info = document.createElement('div');
      info.className = 'info';
      const nickname = document.createElement('span');
      nickname.className = 'nickname'; 
      nickname.textContent = user.nickname;

      const valeur = document.createElement('span');
      valeur.className = 'valeur';
      valeur.textContent = `${emoji}${user[cle].toLocaleString()}`;
      info.append(nickname, valeur);

      carte.append(avatarContainer, info);
      return carte;
    }

    const socket = io();

    socket.on('connect', () => {
      if (pseudo && !isDemo) socket.emit('rejoindre', { pseudo, token, type });
    });

    if (type === 'bestgift') {
      document.getElementById('best-gift-container').style.display = 'flex';
    }

    socket.on('updateBestGift', data => {
      if (type === 'bestgift' && data) {
        document.getElementById('bg-icon').src = safeImageUrl(data.icon, 'https://via.placeholder.com/60');
        document.getElementById('bg-pseudo').textContent = data.pseudo;
      }
    });

    if (type === 'donateurs' || type === 'likers') {
      const leaderboard = document.getElementById('leaderboard');
      leaderboard.style.display = 'flex';
      document.getElementById('titre-classement').textContent = type === 'donateurs' ? 'Top Donateurs' : 'Top Likers';

      function afficherClassementSimple(top3, cle, emoji) {
        const msg = document.getElementById('message-attente-simple');
        if(msg) msg.remove();
        leaderboard.querySelectorAll('.carte-joueur').forEach(el => el.remove());
        (top3 || []).forEach((user, i) => leaderboard.appendChild(creerCarteJoueur(user, i + 1, cle, emoji)));
      }

      socket.on(type === 'donateurs' ? 'updateTopGifters' : 'updateTopLikers', top3 => afficherClassementSimple(top3, type === 'donateurs' ? 'coins' : 'likes', type === 'donateurs' ? '💎 ' : '❤️ '));
    }

    if (type === 'coffre') {
      const coffrePanel = document.getElementById('coffre-panel');
      coffrePanel.style.display = 'flex';

      socket.on('updateCoffre', coffre => {
        if (!coffre) return;
        const grid = document.getElementById('coffre-cases-grid');
        grid.innerHTML = '';
        coffre.caracteres.forEach(char => {
          const div = document.createElement('div');
          div.className = `case-char ${char !== '_' ? 'devoile' : ''}`;
          div.textContent = char !== '_' ? char : '?';
          grid.appendChild(div);
        });
        document.getElementById('coffre-recompense-texte').textContent = `Récompense : ${coffre.recompense}`;
      });
    }

    if (type === 'encheres') {
      const encherePanel = document.getElementById('enchere-panel');
      const chronoEl = document.getElementById('enchere-chrono');
      const infoMiseMinEl = document.getElementById('info-mise-min');
      const infoSnipeDelayEl = document.getElementById('info-snipe-delay');
      const classementEl = document.getElementById('enchere-classement');
      const gagnantEcran = document.getElementById('enchere-gagnant-ecran');
      const groupeChrono = document.getElementById('groupe-chrono');
      const vouchStatusEl = document.getElementById('vouch-status');

      encherePanel.style.display = 'block';

      // TIMER DÉCOMPTE DYNAMIQUE SUR L'OVERLAY
      let intervalleChronoOverlay = null;

      function demarrerTimerChronoOverlay(finTimestamp) {
        if (intervalleChronoOverlay) clearInterval(intervalleChronoOverlay);

        function tick() {
          const restant = Math.max(0, finTimestamp - Date.now());
          const secondes = Math.ceil(restant / 1000);
          chronoEl.textContent = secondes + 's';

          if (restant <= 0 && intervalleChronoOverlay) {
            clearInterval(intervalleChronoOverlay);
            intervalleChronoOverlay = null;
          }
        }

        tick();
        intervalleChronoOverlay = setInterval(tick, 200);
      }

      function afficherEtat(etat) {
        if (!etat) return;
        gagnantEcran.style.display = 'none';
        groupeChrono.style.display = 'block';
        classementEl.style.display = 'flex';

        const finTimestamp = Date.now() + etat.tempsRestant;
        demarrerTimerChronoOverlay(finTimestamp);

        if (etat.phase === 'snipe') {
          chronoEl.classList.add('phase-snipe');
        } else {
          chronoEl.classList.remove('phase-snipe');
        }

        infoMiseMinEl.textContent = etat.miseMinimale > 0 ? etat.miseMinimale.toLocaleString() + ' 💎' : '0 💎';
        infoSnipeDelayEl.textContent = Math.round(etat.snipeMs / 1000) + 's';

        classementEl.innerHTML = '';
        (etat.classement || []).forEach((user) => {
          const div = document.createElement('div');
          div.className = 'carte-podium';

          const img = document.createElement('img');
          img.className = 'avatar';
          img.src = safeImageUrl(user.profilePictureUrl, 'https://ui-avatars.com/api/?name=User');

          const infoDiv = document.createElement('div');
          infoDiv.style.cssText = 'display:flex; flex-direction:column; align-items:flex-start;';

          const nickSpan = document.createElement('span');
          nickSpan.className = 'nickname';
          nickSpan.textContent = user.nickname;

          infoDiv.appendChild(nickSpan);

          const valSpan = document.createElement('span');
          valSpan.className = 'valeur';
          valSpan.textContent = `${user.coins.toLocaleString()} 💎`;

          div.append(img, infoDiv, valSpan);
          classementEl.appendChild(div);
        });
      }

      socket.on('enchereDemarree', afficherEtat);
      socket.on('updateEnchere', afficherEtat);

      socket.on('enchereTerminee', ({ gagnant }) => {
        if (intervalleChronoOverlay) clearInterval(intervalleChronoOverlay);
        groupeChrono.style.display = 'none';
        classementEl.style.display = 'none';
        gagnantEcran.style.display = 'block';

        if (gagnant) {
          document.getElementById('gagnant-avatar').style.display = 'inline-block';
          document.getElementById('gagnant-avatar').src = safeImageUrl(gagnant.profilePictureUrl, 'https://ui-avatars.com/api/?name=Winner');
          document.getElementById('gagnant-nom').textContent = gagnant.nickname;
          document.getElementById('gagnant-total').textContent = gagnant.coins.toLocaleString() + ' 💎 envoyés';
          document.getElementById('gagnant-chat-message').textContent = gagnant.dernierMessageChat ? `"${gagnant.dernierMessageChat}"` : 'En attente...';
          vouchStatusEl.textContent = '⏳ En attente du vouch dans le chat';
          vouchStatusEl.classList.remove('confirme');
        } else {
          document.getElementById('gagnant-avatar').style.display = 'none';
          document.getElementById('gagnant-nom').textContent = 'Aucun gagnant';
          document.getElementById('gagnant-total').textContent = '';
          document.getElementById('gagnant-chat-message').textContent = '--';
        }
      });

      socket.on('updateMessageGagnant', ({ message }) => {
        if (gagnantEcran.style.display === 'block') {
          document.getElementById('gagnant-chat-message').textContent = `"${message}"`;
        }
      });

      socket.on('vouchConfirme', () => {
        vouchStatusEl.textContent = '✅ Vouch confirmé';
        vouchStatusEl.classList.add('confirme');
      });

      socket.on('initVouch', data => { document.getElementById('global-vouch-count').textContent = data.vouches; });
      socket.on('updateVouchGlobal', data => { document.getElementById('global-vouch-count').textContent = data.vouches; });
    }

    if (type === 'objectif') {
      const panel = document.getElementById('objectif-panel');
      panel.style.display = 'block';

      socket.on('updateObjectif', etat => {
        if (!etat) return;
        document.getElementById('objectif-label').textContent = etat.label;
        const pct = Math.min(100, Math.round((etat.valeurActuelle / etat.cible) * 100));
        document.getElementById('objectif-barre-remplissage').style.width = pct + '%';
        const emoji = etat.metrique === 'likes' ? '❤️' : '💎';
        document.getElementById('objectif-valeur-actuelle').textContent = `${emoji} ${etat.valeurActuelle.toLocaleString()}`;
        document.getElementById('objectif-valeur-cible').textContent = `/ ${etat.cible.toLocaleString()}`;
      });
    }
  </script>
</body>
</html>
