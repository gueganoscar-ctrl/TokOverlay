<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>TokOverlay - Mode Élimination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 15px; font-family: 'Inter', sans-serif; color: white; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .elim-layout { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 700px; }
    .elim-timer { font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6); margin-bottom: -10px; font-variant-numeric: tabular-nums; }
    .elim-title { background: #ff2a55; color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; padding: 6px 24px; border-radius: 99px; box-shadow: 0 4px 15px rgba(255, 42, 85, 0.5); }
    .elim-status { background: #f59e0b; color: white; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; padding: 4px 16px; border-radius: 8px; }
    .elim-status.open { background: #10b981; }
    .elim-stats { display: flex; gap: 10px; width: 100%; margin-bottom: 5px; justify-content: center; }
    .stat-block { background: rgba(10, 5, 15, 0.95); border: 2px solid #3f3f46; border-radius: 12px; padding: 8px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .stat-block.gift-block { flex-direction: row; gap: 8px; font-size: 18px; font-weight: 900; color: #ffbe3d; }
    .stat-block.gift-block img { width: 30px; height: 30px; object-fit: contain; }
    .stat-title { font-size: 10px; color: #a1a1aa; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }
    .stat-val { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 900; color: #c084fc; }
    .grid-container { background: rgba(10, 5, 15, 0.95); border: 4px solid #a855f7; border-radius: 16px; padding: 10px; width: 100%; box-shadow: 0 0 40px rgba(168, 85, 247, 0.2); display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-content: flex-start; min-height: 400px; position: relative; }
    .grid-cell { background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; overflow: hidden; position: relative; transition: all 0.15s ease; }
    .grid-cell img { width: 100%; height: 100%; object-fit: cover; }
    .grid-cell.roulette-highlight {
      border-color: #ff2a55 !important;
      box-shadow: 0 0 18px rgba(255, 42, 85, 0.85);
      transform: scale(1.1);
      z-index: 2;
    }
    #elim-popup { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 3px solid #ff2a55; padding: 25px 40px; text-align: center; z-index: 100; border-radius: 16px; box-shadow: 0 0 50px rgba(255, 42, 85, 0.6); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    #winner-screen { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 15px; background: rgba(10, 5, 15, 0.95); border: 4px solid #ffbe3d; border-radius: 16px; padding: 40px; width: 100%; box-shadow: 0 0 60px rgba(255, 190, 61, 0.4); text-align: center; }
    .winner-title { color: #ffbe3d; font-family: 'Space Grotesk', sans-serif; font-size: 32px; text-transform: uppercase; font-weight: 900; margin: 0; }
    .winner-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #ffbe3d; object-fit: cover; box-shadow: 0 0 20px rgba(255, 190, 61, 0.6); }
    .winner-name { font-size: 28px; font-weight: 900; margin: 0; }
    .winner-coins { font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: #ffbe3d; background: rgba(255,190,61,0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(255,190,61,0.4); }
    .winner-chat { font-style: italic; font-size: 18px; color: #a1a1aa; margin-top: 10px; max-width: 80%; }
    .winner-chat strong { color: white; font-style: normal; }
  </style>
</head>
<body>

  <div class="elim-layout" id="game-container" style="display: none;">
    <div class="elim-timer" id="elim-timer-display" style="display:none;">0:00</div>
    <div class="elim-title">💀 ELIMINATION MODE 💀</div>
    <div class="elim-status" id="elim-status">🔒 LOCKED ENTRIES - DO NOT SEND 🔒</div>
    
    <div class="elim-stats">
      <div class="stat-block gift-block">
        <img id="target-gift-img" src="" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/5ea6ceee6885dfb90c910fae1ba1c1bb~tplv-obj.png'">
        <span id="target-gift-price">0</span>
      </div>
      <div class="stat-block"><div class="stat-title">PLAYERS</div><div class="stat-val" id="stat-players">0</div></div>
      <div class="stat-block"><div class="stat-title">COINS</div><div class="stat-val" id="stat-coins" style="color:#ffbe3d">0</div></div>
    </div>

    <div class="grid-container" id="grid">
      <div id="elim-popup">
        <img id="popup-img" src="" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/5ea6ceee6885dfb90c910fae1ba1c1bb~tplv-obj.png'" style="width:90px; height:90px; border-radius:50%; margin-bottom:10px; border: 3px solid #ff2a55; object-fit: cover;">
        <h2 id="popup-name" style="margin:0; color:white; font-family:'Space Grotesk'; font-size:22px;">Pseudo</h2>
        <p style="color:#ff2a55; font-weight:900; font-size:28px; margin:5px 0;">ÉLIMINÉ 💀</p>
        <p style="color:#a1a1aa; margin:0; font-size: 14px;">Chance d'élimination : <span id="popup-prob" style="color:white; font-weight:bold; font-size: 18px;">0%</span></p>
      </div>
    </div>
    
    <div id="winner-screen">
      <h1 class="winner-title">👑 GRAND GAGNANT 👑</h1>
      <img id="winner-img" class="winner-img" src="" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/5ea6ceee6885dfb90c910fae1ba1c1bb~tplv-obj.png'">
      <h2 id="winner-name" class="winner-name">Pseudo</h2>
      <div id="winner-coins" class="winner-coins">Total envoyé: 0 💎</div>
      <div id="winner-chat" class="winner-chat"><strong>Message:</strong> <span>En attente...</span></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const pathParts = window.location.pathname.split('/');
    const pseudo = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const isDemo = params.get('demo') === '1';

    const socket = io();
    socket.on('connect', () => { if (pseudo && !isDemo) socket.emit('rejoindre', { pseudo, token, type: 'elimination' }); });

    const container = document.getElementById('game-container');
    const grid = document.getElementById('grid');
    const statusBadge = document.getElementById('elim-status');
    const popup = document.getElementById('elim-popup');
    const timerDisplay = document.getElementById('elim-timer-display');
    const winnerScreen = document.getElementById('winner-screen');

    let countdownInterval;
    let latestData = null;
    let lastKnownPlacesLength = 0;
    let hasInitializedGrid = false;
    let displayedEliminatedIndexes = new Set();
    let queuedIndexes = new Set();
    let animationQueue = [];
    let isAnimating = false;

    function resetState() {
      displayedEliminatedIndexes = new Set();
      queuedIndexes = new Set();
      animationQueue = [];
      isAnimating = false;
      hasInitializedGrid = false;
      latestData = null;
      lastKnownPlacesLength = 0;
      grid.style.display = 'flex';
      winnerScreen.style.display = 'none';
      popup.style.display = 'none';
    }

    function startTimer(targetTimestamp, isKillTimer = false) {
      clearInterval(countdownInterval);
      if (!targetTimestamp) { timerDisplay.style.display = 'none'; return; }

      timerDisplay.style.display = 'block';
      countdownInterval = setInterval(() => {
        const diff = Math.max(0, targetTimestamp - Date.now());
        const seconds = Math.ceil(diff / 1000);
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        
        if (diff <= 0) {
          clearInterval(countdownInterval);
          // Si c'etait le timer d'ouverture, on verrouille automatiquement visuellement
          if (!isKillTimer && pseudo && !isDemo) {
            statusBadge.className = 'elim-status';
            statusBadge.innerHTML = '🔒 LOCKED ENTRIES - WAITING KILL 🔒';
          }
        }
      }, 100);
    }

    function updateStatsAndStatus(data) {
      const trulyAlive = data.places.filter(p => !p.eliminated);
      document.getElementById('stat-players').textContent = new Set(trulyAlive.map(p => p.id)).size;
      document.getElementById('stat-coins').textContent = data.totalCoins.toLocaleString();
      document.getElementById('target-gift-img').src = data.giftImage || 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/5ea6ceee6885dfb90c910fae1ba1c1bb~tplv-obj.png';
      document.getElementById('target-gift-price').textContent = data.cout;

      if (!data.locked && data.openEndsAt) {
        startTimer(data.openEndsAt, false);
      } else if (data.eliminationEnCours && data.nextElimination) {
        startTimer(data.nextElimination, true);
      } else {
        clearInterval(countdownInterval);
        timerDisplay.style.display = 'none';
      }

      if (data.locked) {
        statusBadge.className = 'elim-status';
        statusBadge.innerHTML = '🔒 LOCKED ENTRIES - DO NOT SEND 🔒';
      } else {
        statusBadge.className = 'elim-status open';
        statusBadge.innerHTML = '🟢 OPEN ENTRIES - SEND GIFTS 🟢';
      }
    }

    function renderCells() {
      if (!latestData || !Array.isArray(latestData.places)) return;

      const displayed = latestData.places
        .map((p, idx) => ({ ...p, idx }))
        .filter(p => !displayedEliminatedIndexes.has(p.idx));

      let count = displayed.length;
      let cellSize = 100;
      if (count > 9) cellSize = 80;
      if (count > 25) cellSize = 60;
      if (count > 49) cellSize = 45;
      if (count > 100) cellSize = 30;
      if (count > 200) cellSize = 20;

      // Nettoyage propre de la grille en conservant le popup
      Array.from(grid.children).forEach(child => { 
        if (child.id !== 'elim-popup') child.remove(); 
      });

      displayed.forEach(place => {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.dataset.placeIndex = place.idx;
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.innerHTML = `<img src="${place.avatar}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(place.nickname || 'User')}&background=random'" alt="${place.nickname || 'User'}">`;
        grid.appendChild(cell);
      });
    }

    function renderGrid(data) {
      if (!data || !data.actif) {
        container.style.display = 'none';
        clearInterval(countdownInterval);
        resetState();
        return;
      }
      container.style.display = 'flex';

      if (data.places.length < lastKnownPlacesLength) {
        resetState();
      }
      lastKnownPlacesLength = data.places.length;
      latestData = data;

      if (!isAnimating && animationQueue.length === 0) {
        updateStatsAndStatus(data);
      }

      // Force l'affichage des cellules dès qu'il y a des joueurs reçus
      renderCells();

      data.places.forEach((p, idx) => {
        if (p.eliminated && !displayedEliminatedIndexes.has(idx) && !queuedIndexes.has(idx)) {
          queuedIndexes.add(idx);
          animationQueue.push({ idx, nickname: p.nickname, avatar: p.avatar, id: p.id });
        }
      });

      if (data.gagnant && animationQueue.length === 0 && !isAnimating) {
        showWinnerScreen(data);
        return;
      }

      grid.style.display = 'flex';
      winnerScreen.style.display = 'none';

      processQueue();
    }

    function runRouletteAnimation(next) {
      return new Promise(resolve => {
        const candidats = Array.from(grid.querySelectorAll('.grid-cell'));

        if (candidats.length === 0) {
          finalizeElimination(next);
          resolve();
          return;
        }

        const totalAliveBefore = candidats.length;
        const userAliveBefore = candidats.filter(c => {
          const idx = parseInt(c.dataset.placeIndex, 10);
          return latestData.places[idx] && latestData.places[idx].id === next.id;
        }).length;
        const prob = totalAliveBefore > 0 ? ((userAliveBefore / totalAliveBefore) * 100).toFixed(1) : '0.0';

        let step = 0;
        const totalSteps = 12;
        let delai = 60;

        function tick() {
          candidats.forEach(c => c.classList.remove('roulette-highlight'));

          let choisi;
          if (step === totalSteps - 1) {
            choisi = candidats.find(c => parseInt(c.dataset.placeIndex, 10) === next.idx);
          } else {
            choisi = candidats[Math.floor(Math.random() * candidats.length)];
          }
          if (choisi) choisi.classList.add('roulette-highlight');

          step++;
          delai += 10;

          if (step < totalSteps) {
            setTimeout(tick, delai);
          } else {
            setTimeout(() => {
              showEliminationPopup(next, prob);
              setTimeout(() => {
                hideEliminationPopup();
                finalizeElimination(next);
                resolve();
              }, 1200);
            }, 400);
          }
        }

        tick();
      });
    }

    function showEliminationPopup(next, prob) {
      document.getElementById('popup-img').src = next.avatar || '';
      document.getElementById('popup-name').textContent = next.nickname || 'Anonyme';
      document.getElementById('popup-prob').textContent = `${prob}%`;
      popup.style.display = 'block';
    }

    function hideEliminationPopup() {
      popup.style.display = 'none';
    }

    function finalizeElimination(next) {
      displayedEliminatedIndexes.add(next.idx);
      queuedIndexes.delete(next.idx);
      const cell = grid.querySelector(`.grid-cell[data-place-index="${next.idx}"]`);
      if (cell) cell.remove();
    }

    function showWinnerScreen(data) {
      clearInterval(countdownInterval);
      timerDisplay.style.display = 'none';
      grid.style.display = 'none';
      popup.style.display = 'none';
      winnerScreen.style.display = 'flex';
      document.getElementById('winner-img').src = data.gagnant.avatar || '';
      document.getElementById('winner-name').textContent = data.gagnant.nickname || 'Anonyme';
      document.getElementById('winner-coins').textContent = `Total envoyé: ${(data.gagnant.coins || 0).toLocaleString()} 💎`;
      const chatSpan = document.querySelector('#winner-chat span');
      if (chatSpan) chatSpan.textContent = data.messageGagnant || 'En attente...';
    }

    async function processQueue() {
      if (isAnimating) return;

      if (animationQueue.length === 0) {
        if (latestData) {
          updateStatsAndStatus(latestData);
        }
        if (latestData && latestData.gagnant) {
          showWinnerScreen(latestData);
        }
        return;
      }

      isAnimating = true;
      const next = animationQueue.shift();
      await runRouletteAnimation(next);
      isAnimating = false;
      processQueue();
    }

    socket.on('updateElimination', renderGrid);

    if (isDemo) {
      // Simulation complète du mode démo jusqu'au grand gagnant
      let demoData = {
        actif: true,
        cout: 10,
        giftImage: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/5ea6ceee6885dfb90c910fae1ba1c1bb~tplv-obj.png',
        locked: true,
        eliminationEnCours: true,
        totalCoins: 1250,
        openEndsAt: 0,
        nextElimination: Date.now() + 5000,
        gagnant: null,
        messageGagnant: 'Merci pour ce super mode !',
        places: [
          { id: 'u1', nickname: 'Alex_Stream', avatar: 'https://ui-avatars.com/api/?name=Alex&background=random', eliminated: false },
          { id: 'u2', nickname: 'Sarah_92', avatar: 'https://ui-avatars.com/api/?name=Sarah&background=random', eliminated: false },
          { id: 'u3', nickname: 'LucasGamer', avatar: 'https://ui-avatars.com/api/?name=Lucas&background=random', eliminated: false },
          { id: 'u4', nickname: 'Emma_Tiktok', avatar: 'https://ui-avatars.com/api/?name=Emma&background=random', eliminated: false },
          { id: 'u5', nickname: 'Thomas_Off', avatar: 'https://ui-avatars.com/api/?name=Thomas&background=random', eliminated: false }
        ]
      };

      renderGrid(demoData);

      // Séquence d'élimination automatique simulée pour la démo
      setTimeout(() => {
        demoData.places[0].eliminated = true; // Élimine Alex
        renderGrid(demoData);
      }, 3000);

      setTimeout(() => {
        demoData.places[1].eliminated = true; // Élimine Sarah
        renderGrid(demoData);
      }, 7000);

      setTimeout(() => {
        demoData.places[2].eliminated = true; // Élimine Lucas
        renderGrid(demoData);
      }, 11000);

      setTimeout(() => {
        demoData.places[3].eliminated = true; // Élimine Emma
        renderGrid(demoData);
      }, 15000);

      setTimeout(() => {
        // Il ne reste que Thomas_Off -> Grand Gagnant !
        demoData.gagnant = {
          nickname: 'Thomas_Off',
          avatar: 'https://ui-avatars.com/api/?name=Thomas&background=random',
          coins: 450
        };
        renderGrid(demoData);
      }, 19000);
    }
  </script>
</body>
</html>
