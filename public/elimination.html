<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TokOverlay - Mode Élimination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: 'Inter', sans-serif;
      color: white; background: transparent;
      display: flex; flex-direction: column; align-items: center; gap: 15px;
    }

    .header-bar {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: rgba(20, 15, 25, 0.95);
      border: 2px solid #a855f7; border-radius: 16px; padding: 15px 30px;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
    }

    .status-badge {
      background: #ef4444; color: white;
      font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px;
      text-transform: uppercase; letter-spacing: 2px;
      padding: 8px 24px; border-radius: 99px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      display: flex; align-items: center; gap: 10px;
    }
    
    .status-badge.locked { background: #f59e0b; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5); }
    .status-badge.waiting { background: #3b82f6; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5); }

    .stats-row { display: flex; gap: 20px; margin-top: 5px; }
    .stat-box { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: 11px; color: #a1a1aa; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }
    .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: #c084fc; }

    .grid-container {
      background: rgba(10, 5, 15, 0.95);
      border: 4px solid #a855f7; border-radius: 16px;
      padding: 10px; width: 600px; max-width: 90vw;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
      display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-content: flex-start;
      min-height: 400px;
    }

    .grid-cell {
      width: 45px; height: 45px;
      background: #18181b; border: 1px solid #3f3f46; border-radius: 6px;
      overflow: hidden; position: relative;
      transition: all 0.3s ease;
    }
    
    .grid-cell img { width: 100%; height: 100%; object-fit: cover; }
    
    .grid-cell.eliminated {
      background: #ef4444; border-color: #ef4444;
      animation: explode 0.5s ease-out forwards;
    }
    .grid-cell.eliminated img { opacity: 0.2; filter: grayscale(100%); }
    .grid-cell.eliminated::after {
      content: '💀'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }

    @keyframes explode {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); z-index: 10; box-shadow: 0 0 20px red; }
      100% { transform: scale(0.9); opacity: 0.5; }
    }

    .grid-container.massive .grid-cell { width: 30px; height: 30px; }
  </style>
</head>
<body>

  <div class="header-bar" id="game-header" style="display: none;">
    <div class="status-badge waiting" id="game-status">⏳ En attente...</div>
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-label">Places occupées</span>
        <span class="stat-value" id="stat-players">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Total Coins</span>
        <span class="stat-value" id="stat-coins" style="color: #ffbe3d;">0</span>
      </div>
    </div>
  </div>

  <div class="grid-container" id="grid" style="display: none;"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const pathParts = window.location.pathname.split('/');
    const pseudo = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const isDemo = params.get('demo') === '1';

    const socket = io();
    socket.on('connect', () => {
      if (pseudo && !isDemo) socket.emit('rejoindre', { pseudo, token, type: 'elimination' });
    });

    const grid = document.getElementById('grid');
    const header = document.getElementById('game-header');
    const statusBadge = document.getElementById('game-status');

    function renderGrid(data) {
      if (!data || !data.actif) {
        header.style.display = 'none';
        grid.style.display = 'none';
        return;
      }

      header.style.display = 'flex';
      grid.style.display = 'flex';

      document.getElementById('stat-players').textContent = data.places.length;
      document.getElementById('stat-coins').textContent = data.totalCoins.toLocaleString();

      if (data.locked) {
        statusBadge.className = 'status-badge locked';
        statusBadge.innerHTML = '🔒 ENTRÉES VERROUILLÉES';
      } else if (data.eliminationEnCours) {
        statusBadge.className = 'status-badge';
        statusBadge.innerHTML = '💀 ÉLIMINATION EN COURS 💀';
      } else {
        statusBadge.className = 'status-badge waiting';
        const imgTag = `<span style="font-size:24px; margin:0 5px;">${data.giftImage || '🎁'}</span>`;
        statusBadge.innerHTML = `🟢 OUVERT (1 place = ${imgTag} ${data.cout} pièces)`;
      }

      if (data.places.length > 100) grid.classList.add('massive');
      else grid.classList.remove('massive');

      grid.innerHTML = '';
      data.places.forEach((place) => {
        const cell = document.createElement('div');
        cell.className = `grid-cell ${place.eliminated ? 'eliminated' : ''}`;
        cell.innerHTML = `<img src="${place.avatar}" alt="${place.nickname}">`;
        grid.appendChild(cell);
      });
    }

    socket.on('updateElimination', renderGrid);

    // MODE DÉMO
    if (isDemo) {
      let mockData = {
        actif: true, cout: 10, giftImage: '🍩', locked: false, eliminationEnCours: false, totalCoins: 1250,
        places: Array(25).fill(0).map((_, i) => ({
          id: i,
          nickname: 'Demo',
          avatar: `https://ui-avatars.com/api/?name=${i}&background=random`,
          eliminated: false
        }))
      };
      
      renderGrid(mockData);

      setInterval(() => {
        mockData.locked = true;
        mockData.eliminationEnCours = true;
        const survivants = mockData.places.filter(p => !p.eliminated);
        if(survivants.length > 1) {
          const aEliminer = survivants[Math.floor(Math.random() * survivants.length)];
          aEliminer.eliminated = true;
          renderGrid(mockData);
        }
      }, 3000);
    }
  </script>
</body>
</html>
