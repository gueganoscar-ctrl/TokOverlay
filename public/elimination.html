<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TokOverlay - Mode Élimination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 15px;
      font-family: 'Inter', sans-serif;
      color: white; background: transparent;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }

    .elim-layout { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 600px; }

    .elim-timer {
      font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; 
      color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6); 
      margin-bottom: -10px; font-variant-numeric: tabular-nums;
    }

    .elim-title {
      background: #ff2a55; color: white;
      font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 20px;
      text-transform: uppercase; letter-spacing: 2px;
      padding: 6px 24px; border-radius: 99px;
      box-shadow: 0 4px 15px rgba(255, 42, 85, 0.5);
    }

    .elim-status {
      background: #f59e0b; color: white;
      font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
      padding: 4px 16px; border-radius: 8px;
    }
    .elim-status.open { background: #10b981; }

    .elim-stats { display: flex; gap: 10px; width: 100%; margin-bottom: 5px; justify-content: center; }

    .stat-block {
      background: rgba(10, 5, 15, 0.95); border: 2px solid #3f3f46; border-radius: 12px;
      padding: 8px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .stat-block.gift-block { flex-direction: row; gap: 8px; font-size: 18px; font-weight: 900; color: #ffbe3d; }
    .stat-block.gift-block img { width: 30px; height: 30px; object-fit: contain; }

    .stat-title { font-size: 10px; color: #a1a1aa; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }
    .stat-val { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 900; color: #c084fc; }

    .grid-container {
      background: rgba(10, 5, 15, 0.95); border: 4px solid #a855f7; border-radius: 16px;
      padding: 10px; width: 100%; box-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
      display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-content: flex-start;
      min-height: 400px; position: relative;
    }

    .grid-cell {
      width: 45px; height: 45px; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px;
      overflow: hidden; position: relative; transition: all 0.3s ease;
    }
    .grid-cell img { width: 100%; height: 100%; object-fit: cover; }
    
    .grid-cell.eliminated { background: #ef4444; border-color: #ef4444; animation: explode 0.5s ease-out forwards; }
    .grid-cell.eliminated img { opacity: 0.2; filter: grayscale(100%); }
    .grid-cell.eliminated::after { content: '💀'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    @keyframes explode { 0% { transform: scale(1); } 50% { transform: scale(1.3); z-index: 10; box-shadow: 0 0 20px red; } 100% { transform: scale(0.9); opacity: 0.5; } }
    .grid-container.massive .grid-cell { width: 30px; height: 30px; }

    #elim-popup {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95); border: 3px solid #ff2a55; padding: 25px 40px; text-align: center;
      z-index: 100; border-radius: 16px; box-shadow: 0 0 50px rgba(255, 42, 85, 0.6);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div class="elim-layout" id="game-container" style="display: none;">
    <div class="elim-timer" id="elim-timer-display" style="display:none;">0:00</div>
    <div class="elim-title">💀 ELIMINATION MODE 💀</div>
    <div class="elim-status" id="elim-status">🔒 LOCKED ENTRIES - DO NOT SEND 🔒</div>
    
    <div class="elim-stats">
      <div class="stat-block gift-block">
        <img id="target-gift-img" src="">
        <span id="target-gift-price">0</span>
      </div>
      <div class="stat-block">
        <div class="stat-title">PLAYERS</div>
        <div class="stat-val" id="stat-players">0</div>
      </div>
      <div class="stat-block">
        <div class="stat-title">COINS</div>
        <div class="stat-val" id="stat-coins" style="color:#ffbe3d">0</div>
      </div>
    </div>

    <div class="grid-container" id="grid">
      <div id="elim-popup">
        <img id="popup-img" src="" style="width:90px; height:90px; border-radius:50%; margin-bottom:10px; border: 3px solid #ff2a55; object-fit: cover;">
        <h2 id="popup-name" style="margin:0; color:white; font-family:'Space Grotesk'; font-size:22px;">Pseudo</h2>
        <p style="color:#ff2a55; font-weight:900; font-size:28px; margin:5px 0;">ÉLIMINÉ 💀</p>
        <p style="color:#a1a1aa; margin:0; font-size: 14px;">Chance d'élimination : <span id="popup-prob" style="color:white; font-weight:bold; font-size: 18px;">0%</span></p>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const pathParts = window.location.pathname.split('/');
    const pseudo = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const isDemo = params.get('demo') === '1';

    const socket = io();
    socket.on('connect', () => { if (pseudo && !isDemo) socket.emit('rejoindre', { pseudo, token, type: 'elimination' }); });

    const container = document.getElementById('game-container');
    const grid = document.getElementById('grid');
    const statusBadge = document.getElementById('elim-status');
    const popup = document.getElementById('elim-popup');
    const timerDisplay = document.getElementById('elim-timer-display');
    
    let prevPlaces = [];
    let countdownInterval;

    function startTimer(nextEliminationTimestamp) {
      clearInterval(countdownInterval);
      if (!nextEliminationTimestamp) { timerDisplay.style.display = 'none'; return; }
      
      timerDisplay.style.display = 'block';
      countdownInterval = setInterval(() => {
        const diff = Math.max(0, nextEliminationTimestamp - Date.now());
        const seconds = Math.ceil(diff / 1000);
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        if (diff <= 0) clearInterval(countdownInterval);
      }, 100);
    }

    function renderGrid(data) {
      if (!data || !data.actif) { container.style.display = 'none'; clearInterval(countdownInterval); return; }
      container.style.display = 'flex';

      const uniquePlayers = new Set(data.places.filter(p => !p.eliminated).map(p => p.id)).size;
      document.getElementById('stat-players').textContent = uniquePlayers;
      document.getElementById('stat-coins').textContent = data.totalCoins.toLocaleString();
      document.getElementById('target-gift-img').src = data.giftImage || 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/5ea6ceee6885dfb90c910fae1ba1c1bb~tplv-obj.png';
      document.getElementById('target-gift-price').textContent = data.cout;

      if (data.eliminationEnCours && data.nextElimination) {
        startTimer(data.nextElimination);
      } else {
        clearInterval(countdownInterval);
        timerDisplay.style.display = 'none';
      }

      if (data.locked) {
        statusBadge.className = 'elim-status';
        statusBadge.innerHTML = '🔒 LOCKED ENTRIES - DO NOT SEND 🔒';
      } else {
        statusBadge.className = 'elim-status open';
        statusBadge.innerHTML = '🟢 OPEN ENTRIES - SEND GIFTS 🟢';
      }

      if (prevPlaces.length > 0 && data.eliminationEnCours) {
        const newlyEliminated = data.places.find((p, i) => p.eliminated && !prevPlaces[i].eliminated);
        if (newlyEliminated) {
          const totalAliveBefore = prevPlaces.filter(p => !p.eliminated).length;
          const userAliveBefore = prevPlaces.filter(p => !p.eliminated && p.id === newlyEliminated.id).length;
          const prob = ((userAliveBefore / totalAliveBefore) * 100).toFixed(1);

          document.getElementById('popup-img').src = newlyEliminated.avatar;
          document.getElementById('popup-name').textContent = newlyEliminated.nickname;
          document.getElementById('popup-prob').textContent = prob + '%';
          
          popup.style.display = 'block';
          setTimeout(() => { popup.style.display = 'none'; }, 2000);
        }
      }
      prevPlaces = JSON.parse(JSON.stringify(data.places));

      if (data.places.length > 100) grid.classList.add('massive'); else grid.classList.remove('massive');

      Array.from(grid.children).forEach(child => { if (child.id !== 'elim-popup') child.remove(); });
      
      data.places.forEach((place) => {
        const cell = document.createElement('div');
        cell.className = `grid-cell ${place.eliminated ? 'eliminated' : ''}`;
        cell.innerHTML = `<img src="${place.avatar}" alt="${place.nickname}">`;
        grid.appendChild(cell);
      });
    }

    socket.on('updateElimination', renderGrid);

    // DÉMO
    if (isDemo) {
      let mockData = {
        actif: true, cout: 1000, giftImage: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8e6c70281b37803db02ce1e3eb8c2786~tplv-obj.png', locked: false, eliminationEnCours: false, totalCoins: 25000,
        places: Array(25).fill(0).map((_, i) => ({ id: i%5, nickname: `Joueur_${i%5}`, avatar: `https://ui-avatars.com/api/?name=J${i%5}&background=random`, eliminated: false })),
        nextElimination: null
      };
      renderGrid(mockData);

      setInterval(() => {
        mockData.locked = true; mockData.eliminationEnCours = true; mockData.nextElimination = Date.now() + 3000;
        const survivants = mockData.places.filter(p => !p.eliminated);
        if(survivants.length > 1) {
          survivants[Math.floor(Math.random() * survivants.length)].eliminated = true;
          renderGrid(mockData);
        }
      }, 3000);
    }
  </script>
</body>
</html>
