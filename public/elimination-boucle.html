<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>TokOverlay - Mode Élimination Classique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 15px; font-family: 'Inter', sans-serif; color: white; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .elim-layout { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 700px; }
    .elim-timer { font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6); margin-bottom: -5px; font-variant-numeric: tabular-nums; }
    .elim-title { background: #6366f1; color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; padding: 6px 24px; border-radius: 99px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5); }
    .elim-stats { display: flex; gap: 10px; width: 100%; margin-bottom: 5px; justify-content: center; }
    .stat-block { background: rgba(10, 5, 15, 0.95); border: 2px solid #3f3f46; border-radius: 12px; padding: 8px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .stat-block.gift-block { flex-direction: row; gap: 8px; font-size: 18px; font-weight: 900; color: #ffbe3d; }
    .stat-block.gift-block img { width: 30px; height: 30px; object-fit: contain; }
    .stat-title { font-size: 10px; color: #a1a1aa; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }
    .stat-val { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 900; color: #c084fc; }
    
    .grid-container { 
      background: rgba(10, 5, 15, 0.95); border: 4px solid #6366f1; border-radius: 16px; padding: 10px; width: 100%; max-width: 700px;
      height: 420px; max-height: 420px; box-shadow: 0 0 40px rgba(99, 102, 241, 0.2); display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; align-content: flex-start; overflow-y: auto; position: relative; 
    }
    .grid-cell { background: #18181b; border: 1px solid #3f3f46; border-radius: 4px; overflow: hidden; position: relative; transition: all 0.15s ease; flex-shrink: 0; }
    .grid-cell img { width: 100%; height: 100%; object-fit: cover; }
    
    body.style-2 .grid-container { border-color: #ffbe3d; }
    body.style-3 .grid-container { border-color: #fe2c55; }
    body.style-4 .grid-container { border-color: #ffffff; }
  </style>
</head>
<body>

  <div class="elim-layout" id="game-container" style="display: none;">
    <div class="elim-timer" id="elim-timer-display" style="display:none;">0:00</div>
    <div class="elim-title">⚡ ÉLIMINATION CLASSIQUE ⚡</div>
    
    <div class="elim-stats">
      <div class="stat-block gift-block">
        <img id="target-gift-img" src="" referrerpolicy="no-referrer">
        <span id="target-gift-price">0</span>
      </div>
      <div class="stat-block"><div class="stat-title">JOUEURS</div><div class="stat-val" id="stat-players">0</div></div>
      <div class="stat-block"><div class="stat-title">PIÈCES</div><div class="stat-val" id="stat-coins" style="color:#ffbe3d">0</div></div>
    </div>

    <div class="grid-container" id="grid"></div>
    
    <div id="winner-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; gap:15px; background:rgba(10, 5, 15, 0.95); border:4px solid #ffbe3d; border-radius:16px; padding:40px; width:100%; height:420px; text-align:center;">
      <h1 style="color:#ffbe3d; font-family:'Space Grotesk'; font-size:32px; font-weight:900; margin:0;">👑 GRAND GAGNANT FINAL 👑</h1>
      <img id="winner-img" src="" referrerpolicy="no-referrer" style="width:120px; height:120px; border-radius:50%; border:4px solid #ffbe3d; object-fit:cover;">
      <h2 id="winner-name" style="font-size:28px; font-weight:900; margin:0;">Pseudo</h2>
      <div id="winner-coins" style="font-family:'Space Grotesk'; font-size:20px; color:#ffbe3d; background:rgba(255,190,61,0.1); padding:5px 15px; border-radius:20px;">Total envoyé: 0 💎</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const pathParts = window.location.pathname.split('/');
    const pseudo = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const style = params.get('style') || '1';

    document.body.className = `style-${style}`;

    const socket = io();
    socket.on('connect', () => { if (pseudo) socket.emit('rejoindre', { pseudo, token, type: 'elimination-boucle' }); });

    const container = document.getElementById('game-container');
    const grid = document.getElementById('grid');
    const winnerScreen = document.getElementById('winner-screen');

    function renderGrid(data) {
      if (!data || !data.actif) { container.style.display = 'none'; return; }
      container.style.display = 'flex';
      
      document.getElementById('stat-players').textContent = new Set(data.places.filter(p => !p.eliminated).map(p => p.id)).size;
      document.getElementById('stat-coins').textContent = data.totalCoins.toLocaleString();
      document.getElementById('target-gift-img').src = data.giftImage || '';
      document.getElementById('target-gift-price').textContent = data.cout;

      const displayed = data.places.map((p, idx) => ({ ...p, idx })).filter(p => !p.eliminated);
      grid.querySelectorAll('.grid-cell').forEach(c => c.remove());

      displayed.forEach(place => {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.style.width = '60px'; cell.style.height = '60px';
        cell.innerHTML = `<img src="${place.avatar}" referrerpolicy="no-referrer">`;
        grid.appendChild(cell);
      });

      if (data.gagnant) {
        grid.style.display = 'none';
        winnerScreen.style.display = 'flex';
        document.getElementById('winner-img').src = data.gagnant.avatar;
        document.getElementById('winner-name').textContent = data.gagnant.nickname;
        document.getElementById('winner-coins').textContent = `Total envoyé: ${data.gagnant.coins.toLocaleString()} 💎`;
      }
    }

    socket.on('updateEliminationBoucle', renderGrid);
  </script>
</body>
</html>
